<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abriendo Escáner...</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
    .btn { background: #1a73e8; color: white; padding: 14px 24px; border-radius: 8px; text-decoration: none; font-size: 18px; font-weight: bold; display: inline-block; margin-top: 20px; }
  </style>
</head>
<body>

  <h2>Abriendo el escáner de Google Drive...</h2>
  <p>Si la aplicación no se abre automáticamente, presiona el botón:</p>
  
  <a id="btnScan" href="#" class="btn">Abrir Cámara de Escaneo</a>

  <script>
    function redirigir() {
      var isAndroid = /Android/i.test(navigator.userAgent);
      
      if (isAndroid) {
        // Formato Intent oficial de Android para forzar el escáner de la app de Drive
        window.location.href = "intent://scan#Intent;scheme=googledrive;package=com.google.android.apps.docs;end";
      } else {
        // Esquema para iPhone (iOS)
        window.location.href = "googledrive://scan";
      }
    }

    // Configurar enlace del botón manual
    var isAndroid = /Android/i.test(navigator.userAgent);
    var urlTarget = isAndroid 
      ? "intent://scan#Intent;scheme=googledrive;package=com.google.android.apps.docs;end" 
      : "googledrive://scan";
      
    document.getElementById('btnScan').setAttribute('href', urlTarget);

    // Intentar abrir automáticamente al cargar
    redirigir();
  </script>

</body>
</html>
